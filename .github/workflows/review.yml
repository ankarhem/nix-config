name: AI review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# One group per PR so a new push cancels both stale reviews at once.
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

jobs:
  opencode-review:
    # Skip automated branches (e.g. dependency bots) and untrusted authors.
    if: >-
      !startsWith(github.event.pull_request.head.ref, 'auto/') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association || '')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/ai-setup
        with:
          github-token: ${{ secrets.NIX_PAT }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}

      - name: Run OpenCode review
        uses: anomalyco/opencode/github@v1.2.9
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        with:
          model: zai-coding-plan/glm-5.3-flash
          prompt: |
            Review this pull request. Do not modify any files — review only.

            Approach:
            - Read the PR description and the full diff before commenting; understand the intent of the change.
            - Verify claims by reading the surrounding code, not just the diff hunks. If you are unsure whether something is a real bug, investigate before flagging it.

            Report only issues that matter:
            - Architectural issues: breaks SOLID principles, it should be elegant, extensible, maintainable and testable code
            - Correctness: bugs, broken logic, unhandled errors, edge cases
            - Security: leaked secrets or credentials, injection, unsafe permissions
            - Breaking changes: API, CLI, or config changes that break existing users or workflows
            - Performance or resource problems introduced by this change
            - Missing test coverage for significant new behavior

            Do not:
            - Restate or summarize the diff
            - Add praise or filler

            Output:
            - One comment, most important issues first.
            - For each issue: file and line, what is wrong, why it matters, and a concrete suggested fix.
            - If the PR is good, say so in one or two sentences and stop.

  claude-review:
    # Skip automated branches (e.g. dependency bots) and untrusted authors.
    if: >-
      !startsWith(github.event.pull_request.head.ref, 'auto/') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association || '')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/ai-setup
        with:
          github-token: ${{ secrets.NIX_PAT }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}

      - name: Run Claude Code review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Yolo: skip Claude's internal tool-approval prompts. Actual GitHub
          # access is still capped by the workflow permissions above (comment
          # only, no contents write).
          claude_args: '--dangerously-skip-permissions'
