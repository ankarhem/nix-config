name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    # Skip automated branches (e.g. dependency bots) and untrusted authors.
    if: >-
      !startsWith(github.event.pull_request.head.ref, 'auto/') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association || '')
    runs-on: ubuntu-latest
    concurrency:
      group: opencode-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      # Give the reviewer a working nix so it can evaluate the flake and
      # verify that packages/options actually exist.
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.NIX_PAT }}
            netrc-file = /home/runner/.config/nix/netrc
            extra-substituters = https://attic.internetfeno.men/main
            extra-trusted-public-keys = main:9AeGSCEdFACRMznpA8b1LZtZ6cLkpdeTQ0Hqa0RmQAA=

      - name: Configure attic cache auth
        # A step's own env is not visible in its `if`, so test the secret directly.
        if: ${{ secrets.ATTIC_TOKEN != '' }}
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          mkdir -p ~/.config/nix
          printf 'machine attic.internetfeno.men\npassword %s\n' "$ATTIC_TOKEN" > ~/.config/nix/netrc
          chmod 600 ~/.config/nix/netrc

      - name: Run OpenCode review
        uses: anomalyco/opencode/github@latest
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        with:
          model: zai-coding-plan/glm-5.3-flash
          prompt: |
            Review this pull request. Do not modify any files — review only.

            Approach:
            - Read the PR description and the full diff before commenting; understand the intent of the change.
            - Verify claims by reading the surrounding code, not just the diff hunks. If you are unsure whether something is a real bug, investigate before flagging it.

            Report only issues that matter:
            - Architectural issues: breaks SOLID principles, it should be elegant, extensible, maintainable and testable code
            - Correctness: bugs, broken logic, unhandled errors, edge cases
            - Security: leaked secrets or credentials, injection, unsafe permissions
            - Breaking changes: API, CLI, or config changes that break existing users or workflows
            - Performance or resource problems introduced by this change
            - Missing test coverage for significant new behavior

            Do not:
            - Restate or summarize the diff
            - Add praise or filler

            Output:
            - One comment, most important issues first.
            - For each issue: file and line, what is wrong, why it matters, and a concrete suggested fix.
            - If the PR is good, say so in one or two sentences and stop.
